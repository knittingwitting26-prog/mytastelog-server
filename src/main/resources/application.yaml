spring:
  application:
    name: mytastelog-server
  profiles:
    default: local
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  photo:
    s3:
      region: ${AWS_REGION:}
      bucket: ${MYTASTELOG_S3_BUCKET:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://mytastelog.private-apps.tossmini.com,https://mytastelog.apps.tossmini.com,https://mytastelog.private-web.tossmini.com,https://mytastelog.web.tossmini.com}
  auth:
    frontend-success-url: ${AUTH_FRONTEND_SUCCESS_URL:http://localhost:5173/}
    frontend-failure-url: ${AUTH_FRONTEND_FAILURE_URL:http://localhost:5173/}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}

naver:
  api-hub:
    local:
      client-id: ${NAVER_API_HUB_CLIENT_ID:}
      client-secret: ${NAVER_API_HUB_CLIENT_SECRET:}
      base-url: https://naverapihub.apigw.ntruss.com
      connect-timeout: 3s
      read-timeout: 5s
  local:
    client-id: ${NAVER_LOCAL_CLIENT_ID:}
    client-secret: ${NAVER_LOCAL_CLIENT_SECRET:}
    base-url: https://openapi.naver.com
  maps:
    api-key-id: ${NAVER_MAPS_API_KEY_ID:}
    api-key: ${NAVER_MAPS_API_KEY:}
    base-url: https://maps.apigw.ntruss.com
    connect-timeout: 3s
    read-timeout: 5s

kakao:
  local:
    rest-api-key: ${KAKAO_LOCAL_REST_API_KEY:}
    base-url: https://dapi.kakao.com
    connect-timeout: 3s
    read-timeout: 5s
